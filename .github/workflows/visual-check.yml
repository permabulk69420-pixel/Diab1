name: Render and verify Tristram
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test browser
        run: |
          npm install --prefix .qa playwright@1.55.1
          .qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Render six views and check movement
        run: |
          python3 -m http.server 8080 >/tmp/diab1-server.log 2>&1 &
          node tests/render.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tristram-renders
          path: qa-renders
