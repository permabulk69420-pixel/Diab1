name: Deploy Diab1 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Capture VR visual proof
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/diab1-preview.log 2>&1 &
          PREVIEW_PID=$!
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done

          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          test -n "$CHROME"

          timeout 90s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --enable-unsafe-swiftshader \
            --hide-scrollbars --window-size=1536,864 --virtual-time-budget=20000 \
            --screenshot=vr-proof-one.png "http://127.0.0.1:4173/?vrproof=one"

          timeout 90s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --enable-unsafe-swiftshader \
            --hide-scrollbars --window-size=1536,864 --virtual-time-budget=20000 \
            --screenshot=vr-proof-two.png "http://127.0.0.1:4173/?vrproof=two"

          test -s vr-proof-one.png
          test -s vr-proof-two.png
          kill "$PREVIEW_PID" || true

      - name: Upload VR proof screenshots
        uses: actions/upload-artifact@v4
        with:
          name: vr-proof
          path: |
            vr-proof-one.png
            vr-proof-two.png
          if-no-files-found: error
          retention-days: 3

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
