name: Deploy Diab1 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Capture VR visual proof
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/diab1-preview.log 2>&1 &
          PREVIEW_PID=$!
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done

          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          test -n "$CHROME"

          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --enable-unsafe-swiftshader \
            --hide-scrollbars --window-size=1536,864 --remote-debugging-port=9222 \
            --remote-allow-origins=* --user-data-dir=/tmp/diab1-proof-chrome about:blank \
            > /tmp/diab1-chrome.log 2>&1 &
          CHROME_PID=$!

          for i in {1..30}; do
            if curl -sf http://127.0.0.1:9222/json/list >/dev/null; then break; fi
            sleep 1
          done

          timeout 75s node <<'NODE'
          const fs = require('fs');

          const sleep = ms => new Promise(r => setTimeout(r, ms));

          async function main() {
            const targets = await fetch('http://127.0.0.1:9222/json/list').then(r => r.json());
            const page = targets.find(t => t.type === 'page');
            if (!page) throw new Error('No Chrome page target');

            const ws = new WebSocket(page.webSocketDebuggerUrl);
            await new Promise((resolve, reject) => {
              ws.addEventListener('open', resolve, { once: true });
              ws.addEventListener('error', reject, { once: true });
            });

            let nextId = 0;
            const pending = new Map();

            ws.addEventListener('message', event => {
              const msg = JSON.parse(event.data);
              if (!msg.id) return;
              const p = pending.get(msg.id);
              if (!p) return;
              pending.delete(msg.id);
              if (msg.error) p.reject(new Error(JSON.stringify(msg.error)));
              else p.resolve(msg.result);
            });

            function send(method, params = {}) {
              return new Promise((resolve, reject) => {
                const id = ++nextId;
                pending.set(id, { resolve, reject });
                ws.send(JSON.stringify({ id, method, params }));
              });
            }

            await send('Page.enable');
            await send('Runtime.enable');
            await send('Emulation.setDeviceMetricsOverride', {
              width: 1536,
              height: 864,
              deviceScaleFactor: 1,
              mobile: false
            });

            async function waitForProof() {
              for (let i = 0; i < 80; i++) {
                await sleep(250);
                try {
                  const result = await send('Runtime.evaluate', {
                    expression: 'document.readyState==="complete" && window.__vrProofReady===true',
                    returnByValue: true
                  });
                  if (result.result?.value === true) return;
                } catch {}
              }
              throw new Error('VR proof scene did not become ready');
            }

            async function capture(mode, filename) {
              await send('Page.navigate', {
                url: 'http://127.0.0.1:4173/?vrproof=' + mode
              });
              await waitForProof();
              await sleep(750);
              const shot = await send('Page.captureScreenshot', {
                format: 'png',
                fromSurface: true
              });
              fs.writeFileSync(filename, Buffer.from(shot.data, 'base64'));
            }

            await capture('one', 'vr-proof-one.png');
            await capture('two', 'vr-proof-two.png');

            ws.close();
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

          STATUS=$?
          kill "$CHROME_PID" || true
          kill "$PREVIEW_PID" || true
          test -s vr-proof-one.png
          test -s vr-proof-two.png
          exit "$STATUS"

      - name: Upload VR proof screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vr-proof
          path: |
            vr-proof-one.png
            vr-proof-two.png
          if-no-files-found: warn
          retention-days: 3

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
