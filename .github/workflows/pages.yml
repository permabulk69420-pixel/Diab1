name: Deploy Diab1 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Capture VR visual proof
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/diab1-preview.log 2>&1 &
          PREVIEW_PID=$!
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done

          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --enable-unsafe-swiftshader             --hide-scrollbars --window-size=1536,864 --remote-debugging-port=9222             --user-data-dir=/tmp/diab1-chrome about:blank > /tmp/diab1-chrome.log 2>&1 &
          CHROME_PID=$!
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:9222/json >/dev/null; then break; fi
            sleep 1
          done

          node <<'NODE'
          const fs = require('fs');

          async function main() {
            const pages = await fetch('http://127.0.0.1:9222/json').then(r => r.json());
            if (!pages.length) throw new Error('Chrome did not expose a page target.');

            const ws = new WebSocket(pages[0].webSocketDebuggerUrl);
            await new Promise((resolve, reject) => {
              ws.addEventListener('open', resolve, { once: true });
              ws.addEventListener('error', reject, { once: true });
            });

            let id = 0;
            const pending = new Map();
            ws.addEventListener('message', event => {
              const msg = JSON.parse(event.data);
              if (!msg.id) return;
              const p = pending.get(msg.id);
              if (!p) return;
              pending.delete(msg.id);
              msg.error ? p.reject(new Error(JSON.stringify(msg.error))) : p.resolve(msg.result);
            });

            function send(method, params = {}) {
              return new Promise((resolve, reject) => {
                const messageId = ++id;
                pending.set(messageId, { resolve, reject });
                ws.send(JSON.stringify({ id: messageId, method, params }));
              });
            }

            await send('Page.enable');
            await send('Runtime.enable');
            await send('Emulation.setDeviceMetricsOverride', {
              width: 1536, height: 864, deviceScaleFactor: 1, mobile: false
            });
            await send('Page.navigate', { url: 'http://127.0.0.1:4173/?vrproof=1' });

            let ready = false;
            for (let i = 0; i < 80; i++) {
              await new Promise(r => setTimeout(r, 250));
              const result = await send('Runtime.evaluate', {
                expression: 'window.__vrProofReady===true',
                returnByValue: true
              });
              if (result.result?.value === true) {
                ready = true;
                break;
              }
            }

            await new Promise(r => setTimeout(r, 1000));
            const shot = await send('Page.captureScreenshot', {
              format: 'png', fromSurface: true
            });
            fs.writeFileSync('vr-proof.png', Buffer.from(shot.data, 'base64'));
            ws.close();

            if (!ready) throw new Error('VR proof scene never reached two-hand ready state.');
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

          STATUS=$?
          kill "$CHROME_PID" || true
          kill "$PREVIEW_PID" || true
          test -s vr-proof.png
          exit "$STATUS"

      - name: Upload VR proof screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vr-proof
          path: vr-proof.png
          if-no-files-found: warn
          retention-days: 3

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
